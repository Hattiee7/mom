<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>给妈妈的爱</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <style>
        :root {
            --main-pink: #ffafbd;
            --dark-pink: #d63384;
            --gold: #d4af37;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background: #fff5f7;
            font-family: 'STKaiti', 'KaiTi', serif;
        }

        /* 1. 精美艺术背景 */
        .art-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255,175,189,0.3) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255,192,203,0.3) 0%, transparent 40%),
                linear-gradient(135deg, #fff5f7 0%, #ffe3e8 100%);
            z-index: -2;
        }

        /* 2. 花雨核心样式 */
        .flower {
            position: fixed;
            top: -50px;
            pointer-events: none;
            z-index: 100; /* 确保在照片上方飘落 */
            user-select: none;
            animation: fall linear forwards, sway ease-in-out infinite alternate;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }

        @keyframes sway {
            from { margin-left: -50px; }
            to { margin-left: 50px; }
        }

        /* 3. 布局容器 */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .card-header {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
        }

        .card-header h1 {
            color: var(--dark-pink);
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 5px;
        }

        /* 4. 照片区域 (占比55%) */
        .photo-section {
            width: 100%;
            height: 55%; 
            margin-top: 20px;
            z-index: 5;
        }

        .swiper-container { width: 100%; height: 100%; }

        .photo-frame {
            width: 80%;
            height: 90%;
            background: white;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 4px;
            position: relative;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 1px solid #f0f0f0;
        }

        /* 5. 固定文字区域 */
        .fixed-text-area {
            flex: 1;
            width: 90%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        .main-message {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 10px;
            color: #555;
            font-weight: bold;
        }

        .heart-beat {
            color: var(--dark-pink);
            font-size: 1.5rem;
            animation: beat 1.5s infinite;
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .footer-sign {
            font-size: 0.9rem;
            color: var(--dark-pink);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="art-bg"></div>
    
    <div class="container">
        <div class="card-header">
            <h1>致最亲爱的妈妈</h1>
            <div style="color:var(--gold); font-weight: bold;">Happy Mother's Day</div>
        </div>

        <div class="photo-section">
            <div class="swiper-container">
                <div class="swiper-wrapper">
                    <div class="swiper-slide" style="display:flex; justify-content:center; align-items:center;">
                        <div class="photo-frame">
                            <img src="./1.jpg">
                        </div>
                    </div>
                    <div class="swiper-slide" style="display:flex; justify-content:center; align-items:center;">
                        <div class="photo-frame" style="transform:rotate(2deg)">
                            <img src="./2.jpg">
                        </div>
                    </div>
                    <div class="swiper-slide" style="display:flex; justify-content:center; align-items:center;">
                        <div class="photo-frame" style="transform:rotate(-2deg)">
                            <img src="./3.jpg">
                        </div>
                    </div>
                </div>
                <div class="swiper-pagination"></div>
            </div>
        </div>

        <div class="fixed-text-area">
            <div class="heart-beat">❤</div>
            <div class="main-message">
                感谢您不是超人<br>
                却为我变成了万能<br>
                这个世界很大，但我的世界里您最美
            </div>
            <div class="footer-sign">—— 永远爱您的孩子：郭逸凡 ——</div>
        </div>
    </div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        // 初始化轮播 (3D Coverflow 效果)
        const swiper = new Swiper('.swiper-container', {
            effect: 'coverflow',
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: 'auto',
            loop: true,
            autoplay: { delay: 3000 },
            coverflowEffect: {
                rotate: 20,
                stretch: 0,
                depth: 100,
                modifier: 1,
                slideShadows: false,
            },
            pagination: { el: '.swiper-pagination', clickable: true },
        });

        // 核心：精美的花雨函数
        function createFlowerRain() {
            const flowers = ['🌸', '💖', '🌷', '🌹', '💗', '✨'];
            const flower = document.createElement('div');
            flower.className = 'flower';
            
            // 随机选择花朵图标
            flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            
            // 随机初始位置和动画参数
            const startLeft = Math.random() * 100; // 0-100vw
            const duration = Math.random() * 5 + 5; // 5-10秒，让下落错落有致
            const delay = Math.random() * 2; // 随机延迟
            const size = Math.random() * 15 + 15; // 15-30px
            
            flower.style.left = startLeft + 'vw';
            flower.style.fontSize = size + 'px';
            flower.style.animationDuration = `${duration}s, ${Math.random() * 2 + 2}s`;
            flower.style.animationDelay = `-${delay}s`; // 负延迟让页面打开时就有花在飞
            
            document.body.appendChild(flower);

            // 动画结束后移除，防止卡顿
            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        // 持续生成花雨
        setInterval(createFlowerRain, 300);

        // 初始化时先生成一波，避免刚打开页面很空
        for(let i=0; i<15; i++) {
            createFlowerRain();
        }
    </script>
</body>
</html>
